<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#292727" />
    <title>Can't reach StudyDesk</title>
    <style>
      /*
       * Self-contained on purpose: the service worker serves this page when the server is
       * unreachable, so it can't depend on the app's hashed CSS or fonts. The colours below
       * mirror the theme tokens in src/app/globals.css (--background, --foreground,
       * --muted-foreground, --primary, --card, --border); keep them in sync by hand.
       */
      :root {
        --background: #292727;
        --card: #2e2b2b;
        --border: #3e3a3a;
        --foreground: #eeebeb;
        --muted-foreground: #a8a1a1;
        --primary: #810505;
        --highlight: #c68f8f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: var(--background);
        color: var(--foreground);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.75rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted-foreground);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: 0;
        border-radius: 0.625rem;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--highlight);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inline (not an <img>) so it renders even though nothing else is cached. -->
      <svg class="logo" viewBox="0 0 56 56" role="img" aria-label="StudyDesk">
        <rect width="56" height="56" rx="12" fill="#810505" />
        <g
          transform="translate(8.4 8.4) scale(1.6)"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </g>
      </svg>
      <h1>Can't reach StudyDesk, is Tailscale on?</h1>
      <p>
        StudyDesk only loads while your device is connected to your Tailscale network. Turn
        Tailscale on, then try again.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      // Reload on its own as soon as the device regains a connection.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
