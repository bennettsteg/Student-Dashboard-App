services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-student_dashboard}
    networks:
      - database-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-student_dashboard}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      BLACKBOARD_ICS_URL: ${BLACKBOARD_ICS_URL}
    networks:
      - database-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["npx", "tsx", "worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-student_dashboard}
      BLACKBOARD_ICS_URL: ${BLACKBOARD_ICS_URL}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-120}
    networks:
      - database-network
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  database-network:
    external: true