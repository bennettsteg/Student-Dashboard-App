services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - database-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      # Loopback only: the app has no login, so it must not be reachable on the LAN or
      # the internet. Host-installed Tailscale exposes it to the tailnet over HTTPS via
      # `tailscale serve` (ADR-0003) - see docs/deployment/tailnet-https.md.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    networks:
      - database-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["npx", "tsx", "worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # The worker sends the daily Reminder push, so it needs the same VAPID keys as the app.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AUTH_URL: ${AUTH_URL:-}
      # The daily mail auto-sync refreshes the Microsoft access token itself.
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
    networks:
      - database-network
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  database-network:
    external: true